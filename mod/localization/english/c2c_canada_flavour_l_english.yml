 ideology_c2c_reformer_can:0 "Canadian Reformer"
 ideology_c2c_reformer_can_desc:0 "#lore This leader wants representative institutions and incremental democratic reform in the colonies.#!"
 ideology_c2c_clear_grit:0 "Clear Grit"
 ideology_c2c_clear_grit_desc:0 "#lore This group pushes democratic reform, church-state separation, and reduced elite privilege.#!"
 ideology_c2c_patriote:0 "Patriote"
 ideology_c2c_patriote_desc:0 "#lore The Patriotes are committed to French Canadian political rights, secular reform, and resistance to appointed colonial government.#!"

