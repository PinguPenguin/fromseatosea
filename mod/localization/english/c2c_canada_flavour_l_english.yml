 concept_c2c_responsible_government:0 "Responsible Government"
 concept_c2c_responsible_government_desc:0 "Responsible government is an executive or cabinet that depends on the confidence of an elected assembly, rather than on the monarch's representative alone."
 concept_c2c_family_compact:0 "Family Compact"
 concept_c2c_family_compact_desc:0 "The Family Compact was a small network of conservative loyalist officeholders, clergy, judges, landowners, and businessmen who exercised much of Upper Canada's political and economic power."

 notification_c2c_colonial_office_meeting_refused_name:0 "Colonial Office Refuses Meeting"
 notification_c2c_colonial_office_meeting_refused_desc:0 "The Colonial Office refused to hear our reformer's case for responsible government."
