 notification_c2c_colonial_office_meeting_accepted_name:0 "Colonial Office Accepts Meeting"
 notification_c2c_colonial_office_meeting_accepted_desc:0 "The Colonial Office agreed to meet our reformer and hear the case for responsible government."
 notification_c2c_colonial_office_meeting_accepted_tooltip:0 "#header $notification_c2c_colonial_office_meeting_accepted_name$#!\n$TOOLTIP_DELIMITER$\n$notification_c2c_colonial_office_meeting_accepted_desc$"

 c2c_canada_union.1.t:0 "The Act of Union"
 c2c_canada_union.1.d:0 "The British Parliament has passed the Act of Union, merging Upper and Lower Canada into a single Province of Canada. The reform centralizes administration and promises order, but it risks deepening the grievances it hopes to settle."
 c2c_canada_union.1.f:0 "Whereas it is necessary that provision be made for the good government of the Provinces of Upper Canada and Lower Canada, in such manner as may secure the rights and liberties and promote the interests of all classes of Her Majesty's subjects."
 c2c_canada_union.1.a:0 "Assimilation and anglicization"
 c2c_canada_union.1.b:0 "Equal citizenship and cultural pluralism"

 c2c_family_compact.1.t:0 "The Crown of America"
 c2c_family_compact.1.d:0 "The Family Compact has secured its grip over Upper Canadian politics. Loyalist landowners, bishops, judges, and financiers present their victory as proof that local authority and imperial loyalty can reinforce one another."
 c2c_family_compact.1.f:0 "A constitution may be written in London, but in the colony it is interpreted at dinner tables, church doors, bank offices, and council chambers."
 c2c_family_compact.1.a:0 "Order is preserved."
 c2c_family_compact.2.t:0 "The Decline of the Family Compact"
 c2c_family_compact.2.d:0 "Their grip on power could not survive the growth of Reform politics. After generations of appointments and favors, the Family Compact is no longer the unquestioned center of Upper Canadian public life."
 c2c_family_compact.2.f:0 "Fortified by family connection and the hopes of officeholders, that party was erected into a durable power. Now even its friends speak of reform."
 c2c_family_compact.2.a:0 "The compact is broken, but loyal Tory politics remain."
 c2c_family_compact.3.t:0 "The Canals"
 c2c_family_compact.3.d:0 "Canals are the arteries of Upper Canadian commerce. The Welland Canal in particular has drawn capital, labor, and controversy, enriching investors while promising a stronger route around Niagara."
 c2c_family_compact.3.f:0 "Stone, water, timber, and credit move together. So do favors."
 c2c_family_compact.3.a:0 "Fund the works."

 c2c_chateau_clique.1.t:0 "The Clique Entrenched"
 c2c_chateau_clique.1.d:0 "The Chateau Clique has kept Lower Canada in loyalist hands. Its allies in commerce, land, and office now present their rule as the only stable answer to colonial uncertainty."
 c2c_chateau_clique.1.f:0 "Patronage is strongest when it calls itself order."
 c2c_chateau_clique.1.a:0 "The councils hold."
 c2c_chateau_clique.2.t:0 "The Clique Falters"
 c2c_chateau_clique.2.d:0 "The Chateau Clique can no longer rely on a secure grip over Lower Canadian politics. Reformers, Patriotes, and local notables are forcing open the old councils."
 c2c_chateau_clique.2.f:0 "Closed doors do not stay closed forever."
 c2c_chateau_clique.2.a:0 "The old order gives way."

 c2c_rebellion.1.t:0 "The [ROOT.GetCountry.GetNameNoFormatting] Rebellion"
 c2c_rebellion.1.d:0 "Across the colony, men of many stations gather with rifles, pikes, petitions, and rumors. Some Reformers still hope for negotiation; radicals say the time for petitioning has passed."
 c2c_rebellion.1.f:0 "The time has arrived, after years of increasing misrule, when the duty owed to country and posterity demands the assertion of rights."
 c2c_rebellion.1.a:0 "Call the militia and stop this insurrection."
 c2c_rebellion.1.b:0 "The fight for a new Canada begins."
 c2c_rebellion.1.c:0 "Negotiate before this burns further."
 c2c_rebellion.2.t:0 "Reformers Intervene"
 c2c_rebellion.2.d:0 "Moderate Reformers step between radicals and the government, arguing that victory can still be won at the negotiating table."
 c2c_rebellion.2.f:0 "A revolution can begin with one shouted word. A constitution takes far longer to build."
 c2c_rebellion.2.a:0 "Let them try."
 c2c_rebellion.3.t:0 "Rallying the Farmers"
 c2c_rebellion.3.d:0 "Radical speakers travel through farming villages, calling on settlers to resist the colonial elite and their patronage networks."
 c2c_rebellion.3.f:0 "They spoke from wagons, tavern steps, and muddy roadsides, promising that the countryside would no longer bow to closed councils."
 c2c_rebellion.3.a:0 "Let us rid ourselves of the compact."
 c2c_rebellion.3.b:0 "A republic goes too far."
 c2c_rebellion.4.t:0 "Courting the Towns"
 c2c_rebellion.4.d:0 "Radical leaders court shopkeepers, printers, and professionals in the towns. If rebellion comes, urban support may decide whether it becomes a movement or a moment."
 c2c_rebellion.4.f:0 "The farmer and the shopkeeper can throw off an oligarchy together, if they can first agree what comes after."
 c2c_rebellion.4.a:0 "Perhaps force is the only answer."
 c2c_rebellion.4.b:0 "Violence leads only to the jails."
 c2c_rebellion.5.t:0 "The Supply Bill"
 c2c_rebellion.5.d:0 "After a hostile assembly threatens to withhold salaries, [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullName] refuses to sign its bills."
 c2c_rebellion.5.f:0 "No canals, no roads, no militia upkeep. If the assembly will not bend, the governor will make the machinery of government grind."
 c2c_rebellion.5.a:0 "Appease the reformers and pass the bill."
 c2c_rebellion.5.b:0 "We must make a point."

 c2c_responsible_gov.1.t:0 "Responsible Government Achieved"
 c2c_responsible_gov.1.d:0 "[ROOT.GetCountry.GetOverlord.GetNameNoFlag] has accepted the principle of [concept_c2c_responsible_government], and [ROOT.GetCountry.GetNameNoFlag] begins the transformation from a colony governed by others to a colony with real domestic self-government."
 c2c_responsible_gov.1.f:0 "All efforts must be directed toward this object: a colonial administration formed and controlled by the majority of the representatives of the people."
 c2c_responsible_gov.1.a:0 "Long live responsible government."
 c2c_responsible_gov.2.t:0 "Appealing to the Colonial Office"
 c2c_responsible_gov.2.d:0 "A leading reformer travels to [ROOT.GetCountry.GetOverlord.GetNameNoFormatting] to lobby the Colonial Office for a more representative form of government."
 c2c_responsible_gov.2.f:0 "The ocean crossing gives plenty of time to rehearse the argument: loyal subjects deserve institutions worthy of their loyalty."
 c2c_responsible_gov.2.a:0 "Give the reformer our full support."
 c2c_responsible_gov.2.b:0 "This is a waste of time."
 c2c_responsible_gov.3.t:0 "Audience with a Colonial Reformer"
 c2c_responsible_gov.3.d:0 "A reformer from the Canadian colonies has requested an audience with the Colonial Office to discuss responsible government."
 c2c_responsible_gov.3.f:0 "He waits in London with a portfolio of resolutions, grievances, and carefully measured loyalty."
 c2c_responsible_gov.3.a:0 "Turn him away."
 c2c_responsible_gov.3.b:0 "Hear what he has to say."
 c2c_responsible_gov.4.t:0 "The Resolutions"
 c2c_responsible_gov.4.d:0 "Radicals and Reformers gather to discuss their grievances and draft resolutions for Britain."
 c2c_responsible_gov.4.f:0 "The list begins with loyalty to the Crown and then turns, line by line, to the abuses of councils, governors, and closed doors."
 c2c_responsible_gov.4.a:0 "The Reformers have shown poise."
 c2c_responsible_gov.4.b:0 "The Radicals inspire grander demands."
 c2c_responsible_gov.5.t:0 "Resolutions from the Colonies"
 c2c_responsible_gov.5.d:0 "Moderate resolutions have arrived from a Canadian colony, listing grievances and asking for responsible government."
 c2c_responsible_gov.5.f:0 "They are loyal in tone, careful in argument, and persistent in what they demand."
 c2c_responsible_gov.5.a:0 "Reject these complaints."
 c2c_responsible_gov.5.b:0 "Offer a conciliatory reply."
 c2c_responsible_gov.6.t:0 "Radical Resolutions from the Colonies"
 c2c_responsible_gov.6.d:0 "A sharper set of resolutions has arrived from a Canadian colony, condemning appointed rule and demanding sweeping constitutional change."
 c2c_responsible_gov.6.f:0 "Between loyalty and revolt lies a dangerous language of rights."
 c2c_responsible_gov.6.a:0 "These demands cannot be accepted."
 c2c_responsible_gov.6.b:0 "Make concessions before this worsens."

 c2c_characters.1.t:0 "George Brown"
 c2c_characters.1.d:0 "[SCOPE.sCharacter('c2c_george_brown').GetFullName] has made a name in Toronto as a publisher, organizer, and fierce critic of colonial government."
 c2c_characters.1.f:0 "A newspaper can be a business, a weapon, and a summons."
 c2c_characters.1.a:0 "Put his talents to work in politics."
 c2c_characters.1.b:0 "Let his public voice remain independent."
 c2c_characters.2.t:0 "Lord Durham Comes to Canada"
 c2c_characters.2.d:0 "[SCOPE.sCharacter('c2c_lord_durham').GetFullName], a British reformer and peer, has been sent to investigate colonial tensions and recommend a settlement."
 c2c_characters.2.f:0 "The empire sends a troubleshooter, and the colonies learn how much trouble London is willing to see."
 c2c_characters.2.a:0 "Welcome him to Canada."
 c2c_governor_arrives_tt:0 "[SCOPE.sCharacter('c2c_lord_durham').GetFullName] becomes [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] of [ROOT.GetCountry.GetName]."
 c2c_governor_returns_tt:0 "[SCOPE.sCharacter('c2c_current_ruler').GetFullName] returns to [ROOT.GetCountry.GetOverlord.GetName]."

 c2c_no_confidence.1.t:0 "Vote of No Confidence"
 c2c_no_confidence.1.d:0 "The government lacks the votes to pass its bill. Opposition members have turned legislative failure into a humiliating vote of no confidence."
 c2c_no_confidence.1.f:0 "The government no longer commands the house. Let the country answer."
 c2c_no_confidence.1.a:0 "Call an election."

