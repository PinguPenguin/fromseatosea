l_english:
 c2c_union_act_decision:0 "Pass the Act of Union"
 c2c_union_act_decision_desc:0 "Unite Upper and Lower Canada into one Province of Canada, settling colonial unrest through centralization. The union may become a step toward responsible government or a pressure valve for old grievances."
 c2c_union_act_support_tt:0 "Pressure for a Canadian union is at least #v 200#!"

 je_c2c_responsible_government:0 "Responsible Government"
 je_c2c_responsible_government_reason:0 "Since the Constitutional Act of 1791, the balance of power has rested with governors and appointed councils. Reformers are demanding that executive power answer to the elected assembly, giving British North Americans the same political liberties they claim as subjects of the Crown."
 je_c2c_responsible_government_button_lobby:0 "Lobby Colonial Office"
 je_c2c_responsible_government_button_lobby_desc:0 "Send a leading reformer to Britain to plead the case for responsible government."
 je_c2c_responsible_government_button_resolution:0 "Draft Resolutions"
 je_c2c_responsible_government_button_resolution_desc:0 "Have reformers and radicals draft a list of colonial grievances for Britain."
 c2c_sovereignist_in_gov_tt:0 "A reformist or sovereignist force has been in government for #v 6#! consecutive months (currently #v [ROOT.GetCountry.MakeScope.Var('c2c_sovereignist_in_gov_timer').GetValue]#!)."
 c2c_not_granted_responsible_government_tt:0 "[ROOT.GetCountry.GetName] has been granted [concept_c2c_responsible_government] by [ROOT.GetCountry.GetOverlord.GetName]."

 je_c2c_family_compact:0 "Family Compact"
 je_c2c_family_compact_reason:0 "A small group of conservative loyalist landowners, clergy, judges, and businessmen dominate Upper Canada's councils and patronage networks. Their agenda is to preserve appointed authority, the Clergy Reserves, and a politics of loyalty to the imperial connection."
 je_c2c_family_compact_complete_header:0 "#title The Family Compact will secure its grip if:#!"
 je_c2c_family_compact_failure_header:0 "#title The Family Compact will be dismantled if:#!"
 je_c2c_family_compact_progress_bar_complete_tt:0 "The #variable $c2c_cement_conservatism_bar_name$#! progress bar has reached #variable 100%#!"

 je_c2c_chateau_clique:0 "Chateau Clique"
 je_c2c_chateau_clique_reason:0 "A conservative coalition of loyalist landowners, financiers, and officeholders has tightened its grip on Lower Canadian politics. If the clique can keep control of government and blunt reformist pressure, it may entrench a durable colonial order."
 je_c2c_chateau_clique_complete_header:0 "#title The Chateau Clique will secure its grip if:#!"
 je_c2c_chateau_clique_failure_header:0 "#title The Chateau Clique will be broken if:#!"
 c2c_no_english_igs_current_tt:0 "No British or Anglo-Canadian character currently leads an [concept_interest_group] in [ROOT.GetCountry.GetNameNoFlag]."
 c2c_no_english_igs_tt:0 "The following has been true for #v 12#! consecutive months (currently #v [ROOT.GetCountry.MakeScope.Var('c2c_no_english_igs').GetValue]#!)."
 c2c_chateau_clique_timer_tt:0 "The Chateau Clique has maintained control for #v 10#! years (currently #v [ROOT.GetCountry.MakeScope.Var('c2c_chateau_clique_timer').GetValue]#!)."

 je_c2c_representation_by_pop:0 "Representation by Population"
 je_c2c_representation_by_pop_reason:0 "After the union of Upper and Lower Canada, the question of representation by population becomes impossible to ignore. Reformers argue that a united province must answer to its voters rather than to a fixed colonial balance."

 je_c2c_canada_rebellion:0 "The [ROOT.GetCountry.GetNameNoFormatting] Rebellion"
 je_c2c_canada_rebellion_reason:0 "Public grievances against oligarchic colonial government have been building for years. Reformers condemn appointed councils, patronage, and imperial indifference; radicals now argue that petitions and assemblies are not enough."
 je_c2c_canada_rebellion_complete_header:0 "#title The rebellion will be tempered if:#!"
 je_c2c_canada_rebellion_failure_header:0 "#title The rebellion will begin if:#!"

