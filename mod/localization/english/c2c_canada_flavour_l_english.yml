 law_c2c_responsible_colonial_administration:0 "Responsible Colonial Administration"
 law_c2c_responsible_colonial_administration_desc:0 "The colony remains under imperial sovereignty, but its executive council is expected to answer to the elected assembly rather than the governor alone."
 amendment_c2c_appointed_executive:0 "Appointed Executive Council"
 amendment_c2c_appointed_executive_desc:0 "The governor appoints executive councillors regardless of assembly confidence."
 amendment_c2c_clergy_reserves:0 "Clergy Reserves"
 amendment_c2c_clergy_reserves_desc:0 "Large tracts of land are reserved for the Anglican Church, enriching the Church while angering settlers and dissenters."
 amendment_c2c_patronage_appointments:0 "Patronage Appointments"
 amendment_c2c_patronage_appointments_desc:0 "Civil offices are distributed through personal loyalty and elite networks."
 amendment_c2c_meritocratic_appointments:0 "Meritocratic Appointments"
 amendment_c2c_meritocratic_appointments_desc:0 "Civil offices are increasingly awarded by competence rather than compact loyalty."

