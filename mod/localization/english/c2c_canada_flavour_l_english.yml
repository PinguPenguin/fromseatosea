 c2c_confederation.1.t:0 "An Invitation to Confederation"
 c2c_confederation.1.d:0 "[ROOT.GetCountry.GetNameNoFlag] has resolved to invite the Canadian colonies into a single confederation."
 c2c_confederation.1.f:0 "The old colonial boundaries were drawn for administration. The new proposal asks whether they can be made into a country."
 c2c_confederation.1.a:0 "Send the invitations."
 c2c_confederation.2.t:0 "The Terms of Confederation"
 c2c_confederation.2.d:0 "[SCOPE.sCountry('c2c_initiator_scope').GetNameNoFlag] has invited [ROOT.GetCountry.GetNameNoFlag] to join a Canadian confederation."
 c2c_confederation.2.f:0 "Union promises common defense, shared credit, and a larger political stage. It also asks each colony to surrender a familiar measure of control."
 c2c_confederation.2.a:0 "Join the confederation."
 c2c_confederation.2.b:0 "Remain apart."
 c2c_confederation.3.t:0 "The Dominion of Canada"
 c2c_confederation.3.d:0 "The Canadian colonies have entered confederation, creating a new self-governing dominion."
 c2c_confederation.3.f:0 "The work of union begins after the signatures dry."
 c2c_confederation.3.a:0 "A mari usque ad mare."

 c2c_conferences.1.t:0 "A Conference on Confederation"
 c2c_conferences.1.d:0 "[ROOT.GetCountry.GetNameNoFlag] is preparing to gather colonial representatives and test support for a Canadian union."
 c2c_conferences.1.f:0 "Dinner rooms, railway timetables, and constitutional drafts all become part of the same negotiation."
 c2c_conferences.1.a:0 "Invite the colonies."
 c2c_conferences.1.b:0 "Prepare our own delegation first."
 c2c_conferences.2.t:0 "Conference Invitation"
 c2c_conferences.2.d:0 "[SCOPE.sCountry('c2c_conference_host').GetNameNoFlag] has invited [ROOT.GetCountry.GetNameNoFlag] to a conference on Canadian confederation."
 c2c_conferences.2.f:0 "To attend is not to agree, but it is to admit that the question now belongs on the table."
 c2c_conferences.2.a:0 "Send representatives."
 c2c_conferences.2.b:0 "Decline the invitation."

