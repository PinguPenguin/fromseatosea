l_english:
 c2c_dependency.1.t: "From Sea to Sea: Mod Setup Problem"
 c2c_dependency.1.d: "Your playset is not set up the way From Sea to Sea needs. Canadian states, history and startup effects may not load correctly in this game."
 c2c_dependency.1.f: "From Sea to Sea requires Community Mod Framework, placed above it in the load order. It no longer uses Community State Framework, which would overwrite its North American state regions."
 c2c_dependency.1.a: "I'll fix my playset."
 c2c_dependency.1.b: "Community State Framework is loaded."
 c2c_dependency.1.e: "Community Mod Framework is missing."
 c2c_csf_is_loaded: "#bold Community State Framework#! is loaded. Both mods define North America's state regions, so remove it from the playset."
 c2c_cmf_is_missing: "#bold Community Mod Framework#! is not active."
