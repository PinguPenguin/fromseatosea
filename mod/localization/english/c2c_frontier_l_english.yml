l_english:
 je_c2c_settling_the_prairie:0 "Settling the Prairie"
 je_c2c_settling_the_prairie_reason:0 "The prairies are fertile, but barely connected to the buyers that might sustain them. First, surveys need to be done and treaties made before they can support colonization."
 c2c_settling_the_prairie_complete_tt:0 "All owned prairie frontier [Concept('concept_state','$concept_states$')] have been settled."
 je_c2c_the_canadian_north:0 "The Canadian North"
 je_c2c_the_canadian_north_reason:0 "The Canadian Shield and boreal forest hold limitless natural wealth, but harsh cold and long distances make private investment prohibitively expensive. Lasting growth needs our attention."
 c2c_the_canadian_north_complete_tt:0 "All owned northern frontier [Concept('concept_state','$concept_states$')] have been developed."

 c2c_survey_prairie_button:0 "Survey Prairie Lands"
 c2c_survey_prairie_button_desc:0 "Organize surveys and begin on early settlement roads in an owned prairie state."
 c2c_settle_prairie_button:0 "Promote Homestead Settlement"
 c2c_settle_prairie_button_desc:0 "Use growth to turn a surveyed state into a settled one."
 c2c_survey_north_button:0 "Survey Northern Districts"
 c2c_survey_north_button_desc:0 "Send surveyors into an owned northern state to find routes for logging roads and mines."
 c2c_build_north_corridors_button:0 "Build Northern Infrastructure"
 c2c_build_north_corridors_button_desc:0 "Use growth to establish a permanent northern presence."

 c2c_prairie_unopened:0 "Unopened Prairie"
 c2c_prairie_surveyed:0 "Surveyed Prairie"
 c2c_prairie_settled:0 "Prairie Settlement"
 state_trait_c2c_northern_canadian_terrain_surveyed:0 "Surveyed Northern Terrain"
 state_trait_c2c_northern_canadian_terrain_corridors:0 "Northern Access Corridors"
