 c2c_northern_resource_corridors:0 "Resource Development Areas"
 c2c_northern_expedited_surveys:0 "Expedited Northern Surveys"
 c2c_frontier_development_disruption:0 "Frontier Development Disruption"
 c2c_treaty_survey_relief:0 "Treaty Survey Provisions"
