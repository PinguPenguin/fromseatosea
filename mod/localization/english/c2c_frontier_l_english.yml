 c2c_frontier.1.t:0 "Lines Across the Grass"
 c2c_frontier.1.d:0 "Survey parties in [SCOPE.sState('c2c_prairie_state_scope').GetName] have begun turning a loose frontier of trails and rivers into future lots for settlement."
 c2c_frontier.1.f:0 "Maps, posts and arguments moved west together. Drawing a straight line on paper was easy, but making it actually mean something on the ground was not."
 c2c_frontier.1.a:0 "The grid will make room for settlement."
 c2c_frontier.1.b:0 "Treaties and deals must come first."
 c2c_frontier.2.t:0 "The Homestead Belt"
 c2c_frontier.2.d:0 "Rail access and markets have made [SCOPE.sState('c2c_prairie_state_scope').GetName] a more practical destination for farm families and ranchers."
 c2c_frontier.2.f:0 "The first harvests were shaky, but each grain elevator and schoolhouse made the next season feel less improvised."
 c2c_frontier.2.a:0 "Open the district."
 c2c_frontier.3.t:0 "Into the Interior"
 c2c_frontier.3.d:0 "Surveyors in [SCOPE.sState('c2c_north_state_scope').GetName] have mapped routes through difficult country, identifying places where permanent towns might hold and resources may lie."
 c2c_frontier.3.f:0 "The reports came back crumpled, smoky, and full of what-ifs. Still, the blank spaces were no longer quite blank."
 c2c_frontier.3.a:0 "Push the surveys forward."
 c2c_frontier.3.b:0 "Fund the provisions, whatever the cost."
 c2c_frontier.4.t:0 "Northern Corridors"
 c2c_frontier.4.d:0 "Railways have given [SCOPE.sState('c2c_north_state_scope').GetName] more links to the wider economy."
 c2c_frontier.4.f:0 "Stations, mines, and company stores first started showing up as dots on the map beside the track. Those dots started demanding schools, doctors, and votes."
 c2c_frontier.4.a:0 "The corridor will hold."
 c2c_frontier.5.t:0 "Prairie Settlement"
 c2c_frontier.5.d:0 "The parts of the prairie under our control have been opened."
 c2c_frontier.5.f:0 "What had once been distance on a map was now measured in train schedules and grain prices."
 c2c_frontier.5.a:0 "The prairie is tied to us now."
 c2c_frontier.6.t:0 "The Northern Line"
 c2c_frontier.6.d:0 "Our northern districts are no longer only faraway outposts on a map. They are now connected by rails and resource towns."
 c2c_frontier.6.f:0 "The country remained difficult, cold, and expensive. That was the point; at least the difficulty had a route through it now."
 c2c_frontier.6.a:0 "Keep the line open."
