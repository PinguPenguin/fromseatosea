l_english:
 concept_c2c_responsible_colony:0 "Responsible Colony"
 concept_c2c_responsible_colonies:0 "Responsible Colonies"
 concept_c2c_responsible_colony_desc:0 "A $concept_c2c_responsible_colony$ is a [concept_subject_type] with domestic self-government under an imperial [concept_overlord]. $concept_c2c_responsible_colonies$ cannot start their own [Concept('concept_diplomatic_play', '$concept_diplomatic_plays$')] and are forced to join their [Concept('concept_overlord', '$concept_overlord_possessive$')] [Concept('concept_war', '$concept_wars$')]. They must pay #v 15%#! of their [concept_treasury] income to their $concept_overlord$ each week."
 concept_c2c_self_governing_dominion:0 "Dominion"
 concept_c2c_self_governing_dominions:0 "Dominions"
 concept_c2c_self_governing_dominion_desc:0 "A $concept_c2c_self_governing_dominion$ is a self-governing [concept_subject_type] within the British Empire. $concept_c2c_self_governing_dominions$ can start their own [Concept('concept_diplomatic_play', '$concept_diplomatic_plays$')] and are forced to join their [Concept('concept_overlord', '$concept_overlord_possessive$')] [Concept('concept_war', '$concept_wars$')]. They pay #v none#! of their [concept_treasury] income to their $concept_overlord$ each week."

 c2c_responsible_colony:0 "$concept_c2c_responsible_colony$"
 c2c_responsible_colony_action_name:0 "[concept_c2c_responsible_colony]"
 c2c_responsible_colony_action_propose_name:0 "Make into [concept_c2c_responsible_colony]"
 c2c_responsible_colony_action_break_name:0 "Grant Independence"
 c2c_responsible_colony_action_ask_to_break_name:0 "Demand Independence"
 c2c_responsible_colony_desc:0 "Establishes a [concept_c2c_responsible_colony] [concept_subject_type] relationship between two [Concept('concept_country', '$concept_countries$')]."
 c2c_responsible_colony_pact_desc:0 "[SCOPE.GetRootScope.GetDiplomaticPact.GetSecondCountry.GetName] is a [concept_c2c_responsible_colony] of [SCOPE.GetRootScope.GetDiplomaticPact.GetFirstCountry.GetName]."
 c2c_responsible_colony_action_notification_name:0 "Demand for [concept_c2c_responsible_colony]"
 c2c_responsible_colony_action_notification_desc:0 "[INITIATOR_COUNTRY.GetName] demands that we submit to them and become their [concept_c2c_responsible_colony]."
 c2c_responsible_colony_action_notification_break_name:0 "Independence Granted"
 c2c_responsible_colony_action_notification_break_desc:0 "[INITIATOR_COUNTRY.GetName] have ended our [concept_c2c_responsible_colony] status. We are independent once again."
 c2c_responsible_colony_proposal_notification_break_name:0 "Demand for Independence"
 c2c_responsible_colony_proposal_notification_break_desc:0 "[INITIATOR_COUNTRY.GetName] are demanding that we end their [concept_c2c_responsible_colony] status."
 c2c_responsible_colony_proposal_notification_break_effects_desc:0 "If we accept, they will become fully independent."
 c2c_responsible_colony_proposal_break_accepted_name:0 "Independence Granted"
 c2c_responsible_colony_proposal_break_accepted_desc:0 "[TARGET_COUNTRY.GetName] accepted the demand to end our [concept_c2c_responsible_colony] status. We are independent once again."
 c2c_responsible_colony_proposal_break_declined_name:0 "Independence Refused"
 c2c_responsible_colony_proposal_break_declined_desc:0 "[TARGET_COUNTRY.GetName] refused the demand to end our [concept_c2c_responsible_colony] status."
 c2c_responsible_colony_action_third_party_notification_break_name:0 "Independence Granted"
 c2c_responsible_colony_action_third_party_notification_break_desc:0 "[INITIATOR_COUNTRY.GetName] ended the [concept_c2c_responsible_colony] status of [TARGET_COUNTRY.GetName], granting them full independence."
 c2c_responsible_colony_proposal_third_party_break_accepted_name:0 "Independence Granted"
 c2c_responsible_colony_proposal_third_party_break_accepted_desc:0 "[TARGET_COUNTRY.GetName] ended the [concept_c2c_responsible_colony] status of [INITIATOR_COUNTRY.GetName], granting them full independence."
 c2c_responsible_colony_proposal_third_party_break_declined_name:0 "Independence Refused"
 c2c_responsible_colony_proposal_third_party_break_declined_desc:0 "[TARGET_COUNTRY.GetName] refused to end the [concept_c2c_responsible_colony] status of [INITIATOR_COUNTRY.GetName]."
 c2c_responsible_colony_proposal_notification_name:0 "Subjugation Demand"
 c2c_responsible_colony_proposal_notification_desc:0 "[INITIATOR_COUNTRY.GetName] demands that we submit to them and become their [concept_c2c_responsible_colony]."
 c2c_responsible_colony_proposal_notification_effects_desc:0 "If we accept, we will become their subject."
 c2c_responsible_colony_proposal_accepted_name:0 "Subjugation Accepted"
 c2c_responsible_colony_proposal_accepted_desc:0 "[TARGET_COUNTRY.GetName] accepted the demand for them to become our [concept_c2c_responsible_colony]."
 c2c_responsible_colony_proposal_declined_name:0 "Subjugation Refused"
 c2c_responsible_colony_proposal_declined_desc:0 "[TARGET_COUNTRY.GetName] declined the demand for them to become our [concept_c2c_responsible_colony]."
 c2c_responsible_colony_proposal_third_party_accepted_name:0 "Country Subjugated"
 c2c_responsible_colony_proposal_third_party_accepted_desc:0 "[TARGET_COUNTRY.GetName] agreed to become the [concept_c2c_responsible_colony] of [INITIATOR_COUNTRY.GetName]."
 c2c_responsible_colony_proposal_third_party_declined_name:0 "Subjugation Refused"
 c2c_responsible_colony_proposal_third_party_declined_desc:0 "[TARGET_COUNTRY.GetName] refused to become the [concept_c2c_responsible_colony] of [INITIATOR_COUNTRY.GetName]."
 c2c_responsible_colony_effect_desc_global:0 "Becomes a [concept_c2c_responsible_colony]"
 c2c_responsible_colony_effect_desc_first:0 "[TARGET_COUNTRY.GetName] becomes a [COUNTRY.GetAdjectiveNoFlag] [concept_c2c_responsible_colony]"
 c2c_responsible_colony_effect_desc_third:0 "[AddTextIf(ObjectsEqual(GetMetaPlayer.GetPlayedOrObservedCountry.Self, TARGET_COUNTRY.Self),TARGET_COUNTRY.GetNameNoFlag)][AddTextIf(Not(ObjectsEqual(GetMetaPlayer.GetPlayedOrObservedCountry.Self, TARGET_COUNTRY.Self)),TARGET_COUNTRY.GetName)] becomes a [concept_c2c_responsible_colony] of [COUNTRY.GetName]"
 c2c_responsible_colony_trigger_desc_global:0 "Is a [concept_c2c_responsible_colony]"
 c2c_responsible_colony_trigger_false_desc_global:0 "Is #b not#! a [concept_c2c_responsible_colony]"
 c2c_responsible_colony_trigger_desc_first:0 "[TARGET_COUNTRY.GetNameNoFlag] is a [COUNTRY.GetAdjectiveNoFlag] [concept_c2c_responsible_colony]"
 c2c_responsible_colony_trigger_false_desc_first:0 "[TARGET_COUNTRY.GetNameNoFlag] is #b not#! a [COUNTRY.GetAdjectiveNoFlag] [concept_c2c_responsible_colony]"
 c2c_responsible_colony_trigger_desc_third:0 "[COUNTRY.GetNameNoFlag] is a [concept_c2c_responsible_colony] of [AddTextIf(ObjectsEqual(GetMetaPlayer.GetPlayedOrObservedCountry.Self, TARGET_COUNTRY.Self),TARGET_COUNTRY.GetNameNoFlag)][AddTextIf(Not(ObjectsEqual(GetMetaPlayer.GetPlayedOrObservedCountry.Self, TARGET_COUNTRY.Self)),TARGET_COUNTRY.GetName)]"
 c2c_responsible_colony_trigger_false_desc_third:0 "[COUNTRY.GetNameNoFlag] is #b not#! a [concept_c2c_responsible_colony] of [AddTextIf(ObjectsEqual(GetMetaPlayer.GetPlayedOrObservedCountry.Self, TARGET_COUNTRY.Self),TARGET_COUNTRY.GetName)][AddTextIf(Not(ObjectsEqual(GetMetaPlayer.GetPlayedOrObservedCountry.Self, TARGET_COUNTRY.Self)),TARGET_COUNTRY.GetName)]"
 subject_type_c2c_responsible_colony:0 "@colony! $subject_type_c2c_responsible_colony_no_icon$"
 subject_type_c2c_responsible_colony_no_icon:0 "$concept_c2c_responsible_colony$"

